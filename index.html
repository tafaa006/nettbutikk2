<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pikselbua</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <nav>
        <a href="index.html" id="logo">pikselbua</a>
        <div class="lenker">
            <a href="">hjem</a>
            <a href="">produkter</a>
            <a href="">om oss</a>
        </div>
        <a href="handlekurv.html" class="catsvg2" data-icon="shopping-cart" aria-label="Handlekurv">
            <span id="antallKurv">0</span>
        </a>
    </nav>

    <section class="slides">
        <button id="buttonleft" class="buttons" onclick="plusDivs(-1)">&#10094;</button>

        <img class="mySlides" src="bilder/slides/Slide1.webp">
        <img class="mySlides" src="bilder/slides/Slide2.webp">
        <img class="mySlides" src="bilder/slides/Slide3.webp">
        <img class="mySlides" src="bilder/slides/Slide4.webp">

        <button id="buttonright" class="buttons" onclick="plusDivs(+1)">&#10095;</button>
    </section>

    <section class="typekort">
        <button class="typebuttons" data-kategori="Datamaskiner" title="Datamaskiner" aria-label="Datamaskiner">
            <span class="catsvg" data-icon="computers-laptops"></span>
        </button>
        <button class="typebuttons" data-kategori="Telefoner og nettbrett" title="Telefoner og nettbrett" aria-label="Telefoner og nettbrett">
            <span class="catsvg" data-icon="phones-tablets"></span>
        </button>
        <button class="typebuttons" data-kategori="PC-komponenter" title="PC-komponenter" aria-label="PC-komponenter">
            <span class="catsvg" data-icon="pc-components"></span>
        </button>
        <button class="typebuttons" data-kategori="Skjermer" title="Skjermer" aria-label="Skjermer">
            <span class="catsvg" data-icon="monitors-displays"></span>
        </button>
        <button class="typebuttons" data-kategori="Spilltilbehør" title="Spilltilbehør" aria-label="Spilltilbehør">
            <span class="catsvg" data-icon="gaming-accessories"></span>
        </button>
        <button class="typebuttons" data-kategori="Lyd og hodetelefoner" title="Lyd og hodetelefoner" aria-label="Lyd og hodetelefoner">
            <span class="catsvg" data-icon="audio-headphones"></span>
        </button>
        <button class="typebuttons" data-kategori="Tastatur og mus" title="Tastatur og mus" aria-label="Tastatur og mus">
            <span class="catsvg" data-icon="keyboards-mice"></span>
        </button>
        <button class="typebuttons" data-kategori="TV og hjemmeunderholdning" title="TV og hjemmeunderholdning" aria-label="TV og hjemmeunderholdning">
            <span class="catsvg" data-icon="tvs-home-entertainment"></span>
        </button>
        <button class="typebuttons" data-kategori="Smarthjem" title="Smarthjem" aria-label="Smarthjem">
            <span class="catsvg" data-icon="smart-home-iot"></span>
        </button>
    </section>

    <section class="utvalg">
        <select name="velg tiss" id="">
            <option value="Featured">Featured</option>
            <option value="LTH">Low to high</option>
            <option value="HTL">high to low</option>
            <option value="HR">Highest rating</option>
            <option value="LR">Lowest rating</option>
        </select>
        <select name="Stock" id="">
            <option value="All">All products</option>
            <option value="Lager">In stock</option>
            <option value="ILager">Out of stock</option>
        </select>
        <select name="Vurdering" id="">
            <option value="Alle">All products</option>
            <option value="EnTilTre">1 to 2 stars</option>
            <option value="3to4">3 to 4 stars</option>
            <option value="5to6">5 to 6 stars</option>
        </select>
        <div>
            <label for="Fra">Fra:</label>
            <input type="text" id="Fra" name="Fra">
        </div>
        <div>
            <label for="Til">Til:</label>
            <input type="text" id="Til" name="Til">
        </div>
    </section>

    <section class="sok-container">
        <label for="sokefelt">Søk etter produkt</label>
        <input type="search" id="sokefelt" placeholder="Søk etter produkt...">
    </section>

    <section class="produkter" id="produktContainer"></section>


</body>
<script src="script.js"></script>
<script src="icons.js" defer></script>

</html>
